name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: |
          chmod +x ./gradlew
          sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
          # Используем одинарные кавычки для sed, чтобы избежать проблем с переменными
          sed -i 's/com.game.packagename/${{ github.event.inputs.package_name }}/g' module/src/main/cpp/game.h
          ./gradlew :module:assembleRelease

      # КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: v3 -> v4
      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-${{ github.run_id }} # Добавили ID, чтобы имя было уникальным
          path: out/magisk_module_release/
