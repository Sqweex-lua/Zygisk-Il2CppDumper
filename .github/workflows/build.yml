name: Build Zygisk ImGui
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game"
        required: true
        default: "com.target.game"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nandroid/setup-ndk@v3
        with:
          ndk-version: r25c # Стабильная версия для большинства проектов

      - name: Prepare Package Name
        run: |
          sed -i "s/COM.TARGET.PACKAGE/${{ github.event.inputs.package_name }}/g" jni/module.cpp

      - name: Build arm64-v8a
        run: |
          cmake -S jni -B build/arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/arm64-v8a

      - name: Build armeabi-v7a
        run: |
          cmake -S jni -B build/armeabi-v7a \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/armeabi-v7a

      - name: Prepare Magisk Module
        run: |
          mkdir -p out/zygisk
          cp module.prop out/
          cp build/arm64-v8a/*.so out/zygisk/arm64-v8a.so
          cp build/armeabi-v7a/*.so out/zygisk/armeabi-v7a.so
          cd out && zip -r ../zygisk-imgui.zip ./*

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: ImGui-Module-${{ github.event.inputs.package_name }}
          path: zygisk-imgui.zip
